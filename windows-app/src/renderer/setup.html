<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>Jarvis ProMont – Einrichtung</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 20%, #0f4d83, #092f50 60%); font-family: "Segoe UI", Inter, sans-serif; color: #101820; }
  .card { background: #fff; border-radius: 20px; padding: 32px; width: min(420px, 90vw); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  img { height: 40px; } h1 { font-size: 22px; margin: 18px 0 6px; } p { color: #64717c; font-size: 14px; margin: 0 0 18px; }
  input { width: 100%; box-sizing: border-box; padding: 11px 14px; border: 1px solid #d8e0e6; border-radius: 10px; font-size: 15px; }
  input:focus { outline: 2px solid #0f4d83; border-color: transparent; }
  button { margin-top: 14px; width: 100%; padding: 11px; border: 0; border-radius: 999px; background: #0f4d83; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; } .err { color: #b91c1c; font-size: 13px; min-height: 18px; margin-top: 10px; }
  small { display: block; color: #64717c; margin-top: 16px; font-size: 12px; }
</style>
</head>
<body>
  <form class="card" id="f">
    <img src="../assets/logo.svg" alt="ProMont" />
    <h1>Jarvis einrichten</h1>
    <p>Adresse des Jarvis-Servers eingeben. Danach meldest du dich wie im Browser an.</p>
    <input id="url" placeholder="jarvis.promont.gmbh" autofocus required />
    <button id="b">Verbinden</button>
    <div class="err" id="err" role="alert"></div>
    <small id="v"></small>
  </form>
  <script src="setup.js"></script>
</body>
</html>
