# Build-Einstellungen für Klaic Deploy (oder jedem Nixpacks-Host) (Nixpacks)
# Nixpacks installiert corepack 0.24.1 – das kann pnpm 12 nicht starten (bin/pnpm.cjs fehlt).
# Deshalb vor der Installation ein aktuelles corepack einspielen.
[phases.install]
cmds = [
  "npm install -g corepack@0.36.0 && corepack enable",
  "COREPACK_ENABLE_DOWNLOAD_PROMPT=0 pnpm install --frozen-lockfile",
]
