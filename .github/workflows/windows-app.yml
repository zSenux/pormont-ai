# Baut die Windows-App „Jarvis ProMont“ (windows-app/) auf einem Windows-Rechner bei GitHub.
# Ergebnis: Installer „Jarvis-ProMont-Setup-<version>.exe“ – unter Actions → Lauf → Artifacts herunterladen.
# Mit einem Tag „win-v1.0.1“ entsteht zusätzlich ein GitHub-Release mit dem Installer.
name: Windows-App

on:
  push:
    branches: ["**"]
    paths: ["windows-app/**", ".github/workflows/windows-app.yml"]
    tags: ["win-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows-app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-ProMont-Windows
          path: windows-app/dist/*.exe
          retention-days: 30
      - if: startsWith(github.ref, 'refs/tags/win-v')
        uses: softprops/action-gh-release@v2
        with:
          files: windows-app/dist/*.exe
          name: Jarvis ProMont für Windows ${{ github.ref_name }}
