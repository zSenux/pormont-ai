# Baut die Windows-App „Jarvis ProMont“ (windows-app/) auf einem Windows-Rechner bei GitHub.
# - Andere Branches: Installer nur als Artifact (Actions → Lauf → Artifacts).
# - main: Version 1.0.<Laufnummer>, GitHub-Release „v1.0.<n>“ mit Installer + latest.yml.
#   Installierte Apps finden das Release von selbst (electron-updater) und aktualisieren sich.
name: Windows-App

on:
  push:
    branches: ["**"]
    paths: ["windows-app/**", ".github/workflows/windows-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows-app/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Version setzen
        if: github.ref == 'refs/heads/main'
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - name: Bauen (ohne Veröffentlichen)
        if: github.ref != 'refs/heads/main'
        run: npm run dist
      - name: Bauen und als Update veröffentlichen
        if: github.ref == 'refs/heads/main'
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-ProMont-Windows
          path: windows-app/dist/*.exe
          retention-days: 30
